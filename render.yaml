services:
  - type: web
    name: v10-trading-system
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python -m streamlit run dashboard.py --server.port 10000 --server.address 0.0.0.0 --logger.level=info
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PORT
        value: 10000
    disableDeploy: false
