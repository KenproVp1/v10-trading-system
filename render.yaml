services:
  - type: web
    name: v10-trading-system
    runtime: python
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m uvicorn api:app --host 127.0.0.1 --port 8000 & sleep 3 && python -m streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --logger.level=info --client.showErrorDetails=false
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PIP_ROOT_USER_ACTION
        value: ignore
    disableDeploy: false
