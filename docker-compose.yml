version: '3.8'

services:
  api:
    build: .
    container_name: v10-trading-api
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
    command: python -m uvicorn api:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped

  dashboard:
    build: .
    container_name: v10-trading-dashboard
    ports:
      - "8501:8501"
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - ./:/app
    command: python -m streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --logger.level=info
    restart: unless-stopped
    depends_on:
      - api

networks:
  default:
    name: v10-trading-network
